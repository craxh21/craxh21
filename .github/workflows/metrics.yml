name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"  # This runs the action every day at midnight UTC
  workflow_dispatch:  # Allows manual triggering via the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}  # Store your token in GitHub secrets
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          
          # Plugin options (Enable/Disable as needed)
          plugin_languages: yes
          plugin_followup: yes
          plugin_repositories: yes
          plugin_activity: no
          plugin_lines: yes
          plugin_stars: yes
          plugin_topics: yes
